  <main class="main" id="main">

    <div class="page-header contact-hero">
      <h1 class="header1">Contact</h1>
      <p class="body" style="max-width:520px; margin-top:8px;">
        Have a role, a project, or a question — happy to talk.
      </p>
      <p class="contact-response">&lt;24h response time</p>
    </div>

    <!-- Form — uses Formspree for backend-free submission -->
    <div class="contact-form-wrapper">
      <form
        action="https://formspree.io/f/xkolnnqq"
        method="POST"
        aria-label="Contact form"
      >
        <div class="form-group">
          <label for="email">Your email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
            aria-describedby="email-error"
          >
          <span id="email-error" class="field-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="topic">Topic</label>
          <select id="topic" name="topic" required>
            <option value="" disabled selected>Select a topic</option>
            <option value="full-time">Full-time role</option>
            <option value="contract">Contract / freelance</option>
            <option value="speaking">Speaking</option>
            <option value="say-hi">Say hi</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            placeholder="Tell me what you have in mind."
            required
          ></textarea>
        </div>

        <button type="submit" class="primary" style="max-width:200px; cursor:pointer;">
          Send message
        </button>
      </form>

      <div class="contact-channels">
        <p class="contact-channels__label">Or reach out directly</p>
        <a href="mailto:iuriiosad@gmail.com" class="link" style="color:#222222; text-decoration:none; font-size:18px;">
          iuriiosad@gmail.com
        </a>
        <a href="https://www.linkedin.com/in/iura-osadchuk/" target="_blank" class="link" style="color:#222222; text-decoration:none; font-size:18px;" aria-label="LinkedIn (opens in a new tab)">
          LinkedIn <img src="images/new_window_icon.svg" alt="Open in new window icon" style="vertical-align:middle; height:16px;">
        </a>
      </div>
    </div>

  </main>

  <footer class="footer">
    <ul class="footer__links">
      <li>
        <a href="https://www.linkedin.com/in/iura-osadchuk" class="link footer__link" target="_blank" aria-label="LinkedIn (opens in a new tab)">

        <a href="mailto:iuriiosad@gmail.com" class="link footer__link">

  <script src="/chat.js"></script>
  <script>
    (function () {
      var input = document.getElementById('email');
      var error = document.getElementById('email-error');
      var dirty = false;

      function validate() {
        if (!dirty) return;
        if (input.validity.valid) {
          input.classList.remove('is-invalid');
          error.textContent = '';
        } else {
          input.classList.add('is-invalid');
          error.textContent = 'Please enter a valid email address.';
        }
      }

      input.addEventListener('blur', function () { dirty = true; validate(); });
      input.addEventListener('input', validate);
    })();
  </script>
